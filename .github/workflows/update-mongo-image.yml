name: Update MongoDB Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 2" # Every Tuesday at 10 AM

jobs:
  update-mongo-image:
    name: Update MongoDB Image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull MongoDB Image
        run: docker pull mongo:8.0
      - name: Tag and Push MongoDB Image to GHCR
        run: |
          docker tag mongo:8.0 ghcr.io/${{ github.repository_owner }}/mongo-image:8.0
          docker push ghcr.io/${{ github.repository_owner }}/mongo-image:8.0
      - name: Build and Push Replica-Set Variant to GHCR
        run: |
          docker build \
            --build-arg MONGO_IMAGE=ghcr.io/${{ github.repository_owner }}/mongo-image:8.0 \
            -t ghcr.io/${{ github.repository_owner }}/mongo-image:8.0-rs \
            docker/mongo-rs
          docker push ghcr.io/${{ github.repository_owner }}/mongo-image:8.0-rs
      - name: Resolve latest MongoDB Atlas Local 8.0 tag
        id: atlas-tag
        run: |
          TAG=$(curl -s "https://hub.docker.com/v2/repositories/mongodb/mongodb-atlas-local/tags?page_size=100" | \
            python3 -c "
          import sys, json, re
          d = json.load(sys.stdin)
          tags = [t['name'] for t in d['results'] if re.match(r'^8\.0\.\d+$', t['name'])]
          print(sorted(tags, key=lambda v: list(map(int, v.split('.'))))[-1])
          ")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Pull and Push MongoDB Atlas Local to GHCR
        run: |
          docker pull mongodb/mongodb-atlas-local:${{ steps.atlas-tag.outputs.tag }}
          docker tag mongodb/mongodb-atlas-local:${{ steps.atlas-tag.outputs.tag }} \
            ghcr.io/${{ github.repository_owner }}/mongo-image:8.0-atlas-local
          docker push ghcr.io/${{ github.repository_owner }}/mongo-image:8.0-atlas-local
